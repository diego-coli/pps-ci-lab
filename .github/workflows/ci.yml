name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest  # Prepara un ambiente virtuale Linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17  # Installa Java alla versione appropriata
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle  # Esegue Gradle per verificare che il build funzioni
        run: ./gradlew clean build